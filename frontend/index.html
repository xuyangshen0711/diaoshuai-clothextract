<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>服装内部图片库</title>
  </head>
  <body>
    <section id="page-status" role="status" style="max-width:640px;margin:12vh auto;padding:24px;font-family:system-ui,sans-serif;color:#302d28;background:#faf7f0;line-height:1.8">
      <h1 style="font-size:22px">貂帅服装</h1>
      <p id="page-message">正在加载页面…</p>
      <div id="page-help" hidden>
        <p>请先点击重新加载。若仍无法打开，请使用新版 Chrome 或 Edge，并把下面的提示码发给管理员。</p>
        <button id="page-reload" type="button" style="padding:10px 18px;cursor:pointer">重新加载</button>
        <a href="/" style="margin-left:18px;color:inherit">返回图库</a>
        <p id="page-code" style="font-size:12px"></p>
      </div>
      <noscript>
        <p>浏览器未启用 JavaScript，请开启后重新加载页面。</p>
        <p><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer" style="color:#7a7467;font-size:12px">浙ICP备2026103320号</a></p>
      </noscript>
    </section>
    <script>
      // This small fallback must work even when the application bundle cannot run.
      (function () {
        var status = document.getElementById('page-status');
        var help = document.getElementById('page-help');
        var timer;
        window.pageLoadFailed = function (code) {
          clearTimeout(timer);
          status.hidden = false;
          document.getElementById('page-message').textContent = '页面暂时无法加载，请重试。';
          document.getElementById('page-code').textContent = '提示码：' + code;
          help.hidden = false;
        };
        window.pageLoadReady = function () { clearTimeout(timer); status.hidden = true; };
        window.addEventListener('error', function (event) {
          var target = event.target;
          if (target && (target.tagName === 'SCRIPT' || (target.tagName === 'LINK' && target.rel === 'stylesheet'))) window.pageLoadFailed('PAGE_RESOURCE');
          else if (event instanceof ErrorEvent) window.pageLoadFailed('PAGE_RUNTIME');
        }, true);
        window.addEventListener('unhandledrejection', function () { window.pageLoadFailed('PAGE_REQUEST'); });
        document.getElementById('page-reload').onclick = function () {
          var url = new URL(window.location.href);
          url.searchParams.set('_reload', String(Date.now()));
          window.location.replace(url.href);
        };
        timer = setTimeout(function () { window.pageLoadFailed('PAGE_TIMEOUT'); }, 20000);
      }());
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
